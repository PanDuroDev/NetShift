[package]
name = "netshift"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Windows-focused network route management utility"
license = "UNLICENSED"

[lib]
path = "src/lib.rs"

[[bin]]
name = "netshift"
path = "src/main.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
ipconfig = "0.3.4"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
